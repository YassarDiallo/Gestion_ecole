{% extends "base.html" %} {% load static %} {% load crispy_forms_tags %} 
{% block Content %}

  <div class="row mt-3">
    <div class="card">
      <div class="card-header"><h3>Formulaire d'ajout des utilisateurs</h3></div>
      <div class="card-body">
        <form enctype="multipart/form-data" method="post">
          {% csrf_token %}
          <div class="row">
            {{form|crispy}}
          
          </div>
          <button class="btn btn-success">Valider</button>

        </form>
      </div>
    </div>
  </div>




{% endblock Content %}
