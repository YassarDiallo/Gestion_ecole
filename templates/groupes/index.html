{% extends "base.html" %} {% load static %} {% load crispy_forms_tags %} 
{%block Content %}

<div class="row mt-3">
  <div class="card">
    <div class="card-header">
      <div class="col-md-11">
        <h3>Liste des groupes</h3>
      </div>
      <div class="col-md-1">
        <div class="d-grid">
          <a href="{% url 'groupes_create' %}" class="btn btn-success btn-sm"
            >+Nouveau</a
          >
        </div>
      </div>
    </div>
    <div class="card-body">
      <table class="table table-bordered" id="myTable">
        <thead>
          <tr>
            <th style="width: 5%">N°</th>
            <th>Nom du groupe</th>
            <th style="width: 10%">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for g in groupes %}
          <tr>
            <td>{{forloop.counter}}</td>
            <td>{{g.name}}</td>
            <td class="text-center">
              <button
                type="button"
                class="delete btn btn-danger me-2 btn-sm"
                data-href="{% url 'groupes_delete' g.slug %}"
                data-bs-toggle="modal"
                data-bs-target="#delete"
              >
                <i class="fas fa-trash"></i>
              </button>
              <a
                href="{% url 'groupes_edit' g.slug %}"
                class="btn btn-success btn-sm"
                ><i class="fas fa-edit"></i
              ></a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>


{% endblock Content %}
