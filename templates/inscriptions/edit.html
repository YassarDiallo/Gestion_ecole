{% extends "base.html" %} 
{% load static %} 
{% load crispy_forms_tags %} 
{% block Content %}

  <div class="row mt-3">
    <div class="card">
      <div class="card-header"><h3>Modification d'une inscription </h3></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-3">{{form.eleves|as_crispy_field}}</div>
            <div class="col-md-3">{{form.date_inscription|as_crispy_field}}</div>
            <div class="col-md-3">{{form.status|as_crispy_field}}</div>
            <div class="col-md-3" style="margin-top: 25px;" >
              <div class="d-grid" >
                <button type="submit" class="btn btn-success">Modifier</button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

{% endblock Content %}
